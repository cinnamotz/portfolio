<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="author" content="Chase Lin">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Intro</title>

    <style>

        body {
            margin: 0;
            min-height: 100vh;

            background: linear-gradient(
                329deg,
                rgb(93, 150, 255),
                rgb(255, 169, 184)
            );

            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        h1 {
            font-size: 50px;
        }

        header {
            font-size: 24px;
        }

        header::first-letter {
            font-size: 44px;
        }

        header::first-line {
            color: #ff0000;
            color: rgba(255, 0, 0, 1);
        }

        .gradient-box {
            width: 100%;
            height: 100px;

            background: radial-gradient(
                circle,
                rgb(93, 255, 206),
                rgb(199, 169, 255),
                rgb(171, 83, 98)
            );

            text-align: center;
        }


        .stripe-box {
            width: 600px;
            height: 100px;

            background: repeating-linear-gradient(
                90deg,
                rgb(93, 255, 206),
                rgb(93, 117, 255) 60px,
                rgb(199, 169, 255) 60px,
                rgb(237, 123, 157) 120px
            );
        }

        .rotation {
            transform: rotate(10deg);
        }

        .box-container {
            margin-top: 50px;
            padding: 40px;

            background: linear-gradient(
                329deg,
                rgb(255, 169, 184),
                rgb(93, 150, 255)
            );
        }

        .box-one {
            width: 450px;
            min-height: 80px;

            margin-bottom: 40px;
            padding: 20px;

            background-color: rgb(199, 169, 255);

            border: 10px solid #8b5e83;
            border-radius: 30px;

            box-shadow:
                inset 0 0 0 7px rgb(93, 255, 206);

            text-align: center;
            font-weight: bold;

            box-sizing: border-box;
        }

        .box-two {
            width: 450px;
            min-height: 80px;

            margin-top: 20px;
            padding: 20px;

            background: linear-gradient(
                180deg,
                rgb(171, 83, 98),
                rgb(199, 169, 255)
            );

            border: 16px dashed rgb(93, 150, 255);

            text-align: center;
            color: white;

            box-sizing: border-box;
        }


        .shadow-text {
            font-size: 24px;
            font-weight: bold;

            text-shadow:
                2px 2px 0px #8b5e83,
                4px 4px 0px rgb(171, 83, 98),
                6px 6px 0px rgb(93, 150, 255);
        }

    </style>
</head>


<body>

    <h1>Pseudo Elements</h1>

    <header>
        It was the best of times, <br>
        it was the worst of times.
    </header>


    <h2>Radial Gradient!</h2>

    <div class="gradient-box">
        <h2>Gradient Playground!</h2>
        <p>This box uses a radial gradient.</p>
    </div>


    <h2>Stripes!</h2>

    <div class="stripe-box"></div>


    <h2 class="rotation">Rotation example</h2>


    <div class="box-container">

        <h2>Take the Challenge!</h2>

        <div class="box-one">
            Example one of border, padding, etc.
        </div>


        <div class="box-two">
            <p class="shadow-text">
                Example two of border, padding, etc.
            </p>
        </div>

    </div>

</body>

</html>
