<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue 2</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="drinkorder.js" defer></script>
</head>
<body>
    <div id="drink">
        <h1>Cafe Drinks</h1>

        <label for="drinkSelect">Choose a drink:</label>

        <select id="drinkSelect" v-model="selectedDrink" @change="displayDrink">
            <option disabled value="">-- Choose a Drink --</option>

            <option v-for="eachDrink in drink"
                    :key="eachDrink.drink_name"
                    :value="eachDrink.drink_name">
                {{ eachDrink.drink_name }}
            </option>
        </select>

        <h2>{{ drinkname }}</h2>
        <p>{{ fact }}</p>

        <button @click="showDrink">Show Next Drink</button>
    </div>
    
</body>
</html>
