<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Chase Lin">
    <title>More HTML: Basic Form Elements</title>

    <style>
        header {
            font-size: 24px;
            background-color: #fff0f5;
            color: #8b5e83;
            padding: 15px;
        }

        main {
            margin: 20px;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input, textarea {
            margin-top: 5px;
            padding: 8px;
        }

        textarea {
            width: 300px;
            height: 100px;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
        }
    </style>
</head>
<body>
    <header>Form Practice</header>

<main>
    <form action="showme.html" method="get">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="comments">Comments:</label><br>
        <textarea id="comments" name="comments" rows="4" cols="50" required></textarea><br><br>

        <input type="submit" value="Submit">
    </form>
</body>
</html>
