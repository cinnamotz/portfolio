<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            color: #5a3d4a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 {
            color: #d66a91;
            margin-top: 0;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 2px solid #f2c6d6;
            border-radius: 12px;
            background-color: #fffafd;
            color: #5a3d4a;
            font-size: 16px;
        }

        .buttons {
            margin: 20px 0;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 10px 14px;
            margin: 4px;
            background-color: #f3a9c2;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }

        #result {
            background-color: #fff0f5;
            font-weight: bold;
            text-align: left;
        }

    </style>
</head>

<body>

    <div class="calculator">

        <h1>Calculator</h1>

        <div class="input-group">
            <label for="input1">First Number</label>
            <input type="number" id="input1">
        </div>

        <div class="input-group">
            <label for="input2">Second Number</label>
            <input type="number" id="input2">
        </div>

        <div class="buttons">
            <button id="add">＋ Add</button>
            <button id="subtract">− Subtract</button>
            <button id="multiply">× Multiply</button>
            <button id="divide">÷ Divide</button>
        </div>

        <div class="input-group">
            <label class="result-label" for="result">Result</label>
            <input type="text" id="result" readonly>
        </div>

    </div>

</body>
</html>

<script src="js/calculate.js"></script>
