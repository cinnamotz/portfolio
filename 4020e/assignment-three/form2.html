<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Chase Lin">
    <title>More HTML: More Complex Form Elements</title>

    <style>
        header {
            font-size: 24px;
            background-color: #fff0f5;
            color: #8b5e83;
            padding: 15px;
        }

        main {
            margin: 20px;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input, textarea {
            margin-top: 5px;
            padding: 8px;
        }

        textarea {
            width: 300px;
            height: 100px;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
        }
    </style>
</head>
<body>
    <header>Form Practice</header>

<main>
    <form action="showme.html" method="get">
        <label for="favoritegame">Favorite Game:</label>
        <select id="favoritegame" name="FavoriteGame">
            <option value="zelda">The Legend of Zelda</option>
            <option value="pokemon">Pokemon</option>
            <option value="animal-crossing">Animal Crossing</option>
        </select>

        <label for="favoriteartist">Favorite Music Artist:</label>
        <input list="artists" id="favoriteartist" name="FavoriteArtist">

        <datalist id="artists">
            <option value="Stray Kids">
            <option value="Lyn Lapid">
            <option value="MICO">
            <option value="ONE OK ROCK">
            <option value="YOASOBI ">
        </datalist>

        <fieldset>
            <legend>What kind of game do you like to play?</legend>
            <label>
                <input type="radio" name="gametype" value="simulation">
                Simulation
            </label>
            <label>
                <input type="radio" name="gametype" value="adventure">
                Adventure
            </label>
            <label>
                <input type="radio" name="gametype" value="rpg">
                RPG
            </label>
        </fieldset>

        <label for="hours">How many hours do you play games per week?</label>
        <input 
            type="number" 
            id="hours" 
            name="hours" 
            min="0"
            max="100">

        <br>
            <input type="submit" value="Submit">
    </form>
</body>
</html>
