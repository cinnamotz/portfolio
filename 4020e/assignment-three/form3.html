<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Chase Lin">
    <title>More HTML: Even More Complex Form Elements</title>

    <style>
        header {
            font-size: 24px;
            background-color: #fff0f5;
            color: #8b5e83;
            padding: 15px;
        }

        main {
            margin: 20px;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input, textarea {
            margin-top: 5px;
            padding: 8px;
        }

        textarea {
            width: 300px;
            height: 100px;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
        }
        #colorPreview {
            width: 50px;
            height: 50px;
            margin-top: 10px;
            border: 2px solid #333;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <header>Form Practice</header>

    <main>
        <form action="showme.html" method="get">
            <label for="cat-obsession">How obsessed are you with cats?</label>
            <input type="range" 
            id="cat-obsession" 
            name="cat-obsession" 
            min="0" 
            max="10" 
            step="1"/>

            <span id="catValue">5</span>
            <br>
            <label for="color">Choose a color:</label>
            <input type="color" name="color" id="color" value="#d65a8a">
            <div id="colorPreview"></div>
            <br>
            <input type="submit" value="Submit">
            

            
        </form>
    </main>


    <script>

    const slider = document.getElementById("cat-obsession");
    const output = document.getElementById("catValue");

    output.textContent = slider.value;

    slider.oninput = function() {
        output.textContent = this.value;
    };


    const colorPicker = document.getElementById("color");
    const colorPreview = document.getElementById("colorPreview");

    colorPreview.style.backgroundColor = colorPicker.value;

    colorPicker.oninput = function() {
        colorPreview.style.backgroundColor = this.value;
    };

    </script>
</body>
</html>
