<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Georgia Bulldogs Roster</title>

    <style>
        #goDawgs {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            list-style: none;
            padding: 0;
        }

        #goDawgs li {
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid #d6a5b8;
            padding: 10px;
            width: 150px;
            background-color: #fff5f8;
            border-radius: 8px;
        }

        #goDawgs img {
            width: 100px;
            height: auto;
            margin-top: 8px;
        }
    </style>
</head>

<body>

    <ol id="goDawgs"></ol>
