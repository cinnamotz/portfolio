<!DOCTYPE html>
<html>
<head>
    <title>Random Trivia</title>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            text-align: center;
            background-color: #dceeff;
            margin: 0;
            padding: 30px;
            color: #17365d;
        }

        #titleCard {
            background-color: white;
            max-width: 700px;
            margin: 20px auto 30px;
            padding: 25px;
            border-radius: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        #titleCard h1 {
            color: #17365d;
            margin: 0;
        }

        #titleCard p {
            color: #17365d;
            margin-bottom: 15px;
        }

        #mainDiv {
            margin: 30px;
        }

        .question {
            background-color: white;
            margin: 20px auto;
            padding: 20px;
            border-radius: 20px;
            max-width: 700px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .question h3 {
            color: #17365d;
        }

        .question p {
            font-size: 18px;
            color: #17365d;
        }

        .answer {
            margin: 10px;
            font-weight: bold;
            color: #17365d;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            border: none;
            border-radius: 10px;
            background-color: #17365d;
            color: white;
            font-family: 'Quicksand', sans-serif;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background-color: #28558a;
        }
    </style>
</head>

<body>

    <div id="titleCard">
        <h1>✨ Random Trivia ✨</h1>
        <p>Test your knowledge with 10 random questions!</p>
        <button onclick="qa()">Load new question set</button>
    </div>

    <div id="mainDiv"></div>

    <script>

        let divLoad = document.querySelector("#mainDiv");
        var theAnswer = [];

        function qa() {

            divLoad.innerHTML = "";
            theAnswer = [];

            $.getJSON('https://the-trivia-api.com/v2/questions/?limit=10', function(data) {

                for (let i = 0; i < 10; i++) {

                    divLoad.innerHTML +=
                        "<div class='question'>" +
                        "<h3>Category: " + data[i].category.replaceAll("_", " ").replace(/\b\w/g, c => c.toUpperCase()) + "</h3>" +
                        "<p>" + data[i].question.text + "</p>" +
                        "<div id='answers" + i + "' class='answer'></div>" +
                        "<button onclick='showAnswer(" + i + ")'>Show Answer</button>" +
                        "</div>";

                    theAnswer.push(data[i].correctAnswer);
                }

            });

        }

        function showAnswer(number) {

            let something = "#answers" + number;

            let somethingelse = document.querySelector(something);

            somethingelse.innerHTML = "Answer: " + theAnswer[number];

        }

    </script>

</body>
</html>
