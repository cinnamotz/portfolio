<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UGA Roster Slideshow</title>
    <style>
        body {
            background-color: #fff8fb;
            color: #59405f;
        }

        button {
            background-color: #f3d1e3;
            color: #59405f;
            border: 1px solid #d9a9cf;
            border-radius: 8px;
            padding: 8px 16px;
            margin: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #e7c4e2;
        }
    </style>
</head>


<body>
    <div id="slideshow"></div>

    <button id="previous">Previous</button>
    <button id="next">Next</button>

    <script src="js/slideshow.js"></script>
</body>
</html>
