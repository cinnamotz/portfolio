<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Exercise 1</title>

    <style>

        body {
            font-family: calibri, sans-serif;
            margin: 0;
        }

        header {
            background: pink;
            height: 100px;
        }

        h1 {
            text-align: center;
            color: white;
            line-height: 100px;
            margin: 0;
        }

        section {
            zoom: 0.8;
        }

        article {
            padding: 10px;
            margin: 10px;
            background: rgb(192, 255, 216);
            min-width: 400px;
            max-width: 400px;
        }

        section {
            flex-flow: row wrap;
        }

    </style>
</head>

<body>

    <header>
        <h1>Sample flexbox example</h1>
    </header>

    <section>

        <article>
            <h2>First article</h2>
            <p>Content...</p>
        </article>

        <article>
            <h2>Second article</h2>
            <p>Content...</p>
        </article>

        <article>
            <h2>Third article</h2>
            <p>Content...</p>
        </article>

        <article>
            <h2>Fourth article</h2>
            <p>Content...</p>
        </article>

        <article>
            <h2>Fifth article</h2>
            <p>Content...</p>
        </article>

    </section>

</body>
</html>
