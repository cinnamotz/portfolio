<!DOCTYPE html>

<html>

<head>

    <title>Random Trivia</title>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>

        body {
            font-family: 'Quicksand', sans-serif;
            text-align: center;
            background-color: rgb(185, 255, 255);
            color: #17365d;
        }

        #trivia {
            background-color: white;
            max-width: 700px;
            margin: 80px auto;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        #category {
            font-size: 20px;
            margin: 20px;
            color: #17365d;
        }

        #question {
            font-size: 25px;
            margin: 20px;
            color: #17365d;
        }

        #answer {
            font-size: 20px;
            margin: 20px;
            color: #17365d;
            font-weight: bold;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            border: none;
            border-radius: 10px;
            background-color: #17365d;
            color: white;
            font-family: 'Quicksand', sans-serif;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background-color: #28558a;
        }

    </style>

</head>

<body>

    <div id="trivia">

        <h1>✨ Random Trivia ✨</h1>

        <div id="category"></div>

        <div id="question"></div>

        <div id="answer"></div>

        <button onclick="qa()">New Question</button>

        <button onclick="showAnswer()">Show Answer</button>

    </div>

    <script>

        let question = document.querySelector("#question");
        let answer = document.querySelector("#answer");
        let category = document.querySelector("#category");
        let theAnswer = "";

        function qa() {

            $.getJSON('https://the-trivia-api.com/v2/questions/', function(data) {

                question.innerHTML = data[0].question.text;

                category.innerHTML = "Category: " + data[0].category.replaceAll("_", " ");

                theAnswer = data[0].correctAnswer;

                answer.innerHTML = "";

            });

        }

        function showAnswer() {

            answer.innerHTML = "Answer: " + theAnswer;

        }

        qa();

    </script>

</body>

</html>
