<!DOCTYPE html>
<html>
<head>
    <title>Random Trivia</title>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: rgb(185, 255, 255);
        }

        #trivia {
            margin: 50px;
        }

        #category {
            font-size: 20px;
            margin: 20px;
        }

        #question {
            font-size: 25px;
            margin: 20px;
        }

        #answer {
            font-size: 20px;
            margin: 20px;
        }

        button {
            padding: 10px;
            margin: 5px;
        }
    </style>
</head>

<body>

    <div id="trivia">

        <div id="category"></div>

        <div id="question"></div>

        <div id="answer"></div>

        <button onclick="qa()">New Question</button>

        <button onclick="showAnswer()">Show Answer</button>

    </div>

    <script>

        let question = document.querySelector("#question");
        let answer = document.querySelector("#answer");
        let category = document.querySelector("#category");
        let theAnswer = "";

        function qa() {

            $.getJSON('https://the-trivia-api.com/v2/questions/', function(data) {

                question.innerHTML = data[0].question.text;

                category.innerHTML = "Category: " + data[0].category.replaceAll("_", " ");

                theAnswer = data[0].correctAnswer;

                answer.innerHTML = "";

            });

        }

        function showAnswer() {

            answer.innerHTML = "Answer: " + theAnswer;

        }

        qa();

    </script>

</body>
</html>
